meta:
  name: "Simple IT Equipment Supply Rulebook"
  version: 1
  tender_id: "TEST-TENDER-2026-001"
  bid_date: "2026-08-01"

fields:
  - key: pan.number
    aliases: ["PAN No", "PAN Number", "Permanent Account Number"]
  - key: pan.name
    aliases: ["Name of Entity", "Entity Name", "Name on PAN"]
  - key: gst.gstin
    aliases: ["GSTIN", "GST Identification Number"]
  - key: gst.name
    aliases: ["Legal Name", "Trade Name"]
  - key: exp.years
    aliases: ["experience of", "years experience", "experience"]

rules:
  - id: R1
    statement: "Bidder must possess a valid 10-digit Permanent Account Number (PAN)"
    severity: BLOCKING
    check:
      field: pan.number
      op: MATCHES
      value: "^[A-Z]{5}[0-9]{4}[A-Z]$"
    legal_basis: "Tender Clause 1.1 - Tax Registration"
    explanation: "PAN '{value}': {VERDICT}."

  - id: R2
    statement: "Bidder must possess a valid 15-digit GSTIN"
    severity: BLOCKING
    check:
      field: gst.gstin
      op: MATCHES
      value: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$"
    legal_basis: "Tender Clause 1.2 - GST Compliance"
    explanation: "GSTIN '{value}': {VERDICT}."

  - id: R3
    statement: "Bidder must have at least 2 years of experience in IT supply"
    severity: MAJOR
    check:
      field: exp.years
      op: GE
      value: 2
    legal_basis: "Tender Clause 2.1 - Technical Capability"
    explanation: "Experience declared: {value} years; required {expected} years: {VERDICT}."

consistency:
  - id: C1
    description: "Company name on PAN must match Legal Name on GST certificate"
    left: pan.name
    right: gst.name
    compare: IGNORE_LEGAL_SUFFIX
    severity: MAJOR

  - id: C2
    description: "PAN number must match the embedded 10-digit PAN inside GSTIN"
    left: pan.number
    right: gst.gstin
    compare: VALUE_CONTAINS
    severity: BLOCKING
